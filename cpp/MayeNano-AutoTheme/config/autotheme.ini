; Maye Nano - Auto Theme plugin configuration
; Place this file next to mn.cc.arae.autotheme.dll
; Open Maye Nano Settings to open this plugin's own settings window.

[AutoTheme]
; 1 = enabled (default), 0 = disabled
Enable=1

; Theme file used when Windows is in LIGHT mode (file must exist in theme\).
; Leave unset or empty for the Default theme (cfg.json -> "theme": "").
Light=

; Theme file used when Windows is in DARK mode (file must exist in theme\).
; Leave unset or empty for the Default theme.
Dark=Black-1.json

; 1 = pop up this settings window when Maye Nano's Settings window opens (default: 1)
OpenWithSettings=1

; 1 = write autotheme.log for troubleshooting (default: 0)
DebugLog=0
