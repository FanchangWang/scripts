; Maye Nano - Auto Theme plugin configuration
; Place this file next to mn.cc.arae.autotheme.dll

[AutoTheme]
; 1 = enabled (default), 0 = disabled
Enable=1

; Theme file used when Windows is in LIGHT mode (file must exist in theme\).
; Leave unset or set to an empty string to use the Default theme
; (cfg.json -> "theme": "").
Light=BlueWhite-1.json

; Theme file used when Windows is in DARK mode (file must exist in theme\).
; Leave unset or empty for the Default theme.
Dark=Black-1.json

; How long (ms) to wait before stopping the old Maye Nano process
; (only used when the internal call is disabled).
RestartDelayMs=900

; 1 = call Maye Nano's own theme-apply routine in-process (default, NO restart).
;     Experimental: tied to build 7.0.1.261107 (RVA 0x15D19D0).
; 0 = fall back to restarting the app to apply the theme.
UseInternalCall=1

; 1 = restart Maye Nano to apply the theme when the internal call is disabled.
;     The restart is deferred while the launcher window is visible.
AutoRestart=1

; 1 = write autotheme.log / restart.log for troubleshooting (default: 0)
DebugLog=0





