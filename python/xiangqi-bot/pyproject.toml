[project]
name = "xiangqi-bot"
version = "0.1.0"
description = "JJ象棋 bot"
readme = "README.md"
authors = [
    { name = "古月玄", email = "2651919937@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pure-python-adb>=0.3.0.dev0",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
xiangqi-bot = "xiangqi_bot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "ty>=0.0.70",
]

[tool.ty.environment]
python = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", # 标准
    "I", # 导入
    "UP", "RUF", # 代码现代化
    "B", "BLE", "T10", # Bug
    "SIM", "C4", "PERF", "PIE", # 简化与性能
    "N", # 命名
    "PTH", # 路径
    "PT", # 测试
    "TRY", # 异常
]
ignore = [
    "E501",   # 忽略超长行 (交给 ruff format 自动处理)
    "TRY003", # 允许在 raise Exception(...) 中写长文字说明
    "RUF012", # 允许在类定义中定义可变对象属性 (非常适合 YAML/JSON 配置类)
    "RUF001", # 中文项目大量使用全角标点，不视为歧义
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["I001", "RUF046"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true
