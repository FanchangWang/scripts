<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EnvSwitch · 多版本环境变量切换器</title>
<style>
  :root { color-scheme:light; --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --txt:#22262b; --muted:#6b7280; --accent:#2563eb; --ok:#16834b; --warn:#b45309; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; display:flex; min-height:100vh; background:var(--bg); color:var(--txt); font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }

  /* 左侧菜单 */
  .sidebar { flex:0 0 224px; display:flex; flex-direction:column; background:#1b2432; color:#e5e7eb; }
  .brand { padding:16px 18px 12px; font-size:16px; font-weight:600; color:#fff; }
  .brand small { display:block; margin-top:3px; font-size:11px; font-weight:400; color:#93a1b3; }
  .menu { flex:1; display:flex; flex-direction:column; gap:2px; padding:4px 10px 12px; }
  .menu a { display:block; padding:9px 12px; border-radius:7px; color:#cbd5e1; text-decoration:none; font-size:13.5px; }
  .menu a:hover { background:#26313f; color:#fff; }
  .menu a.active { background:var(--accent); color:#fff; font-weight:600; }
  .side-meta { padding:10px 16px 16px; margin-top:8px; border-top:1px solid #2c3a4b; font-size:11px; color:#8b98a9; word-break:break-all; }

  /* 右侧内容 */
  .shell { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { display:flex; align-items:baseline; gap:12px; padding:14px 24px; background:#fff; border-bottom:1px solid var(--line); }
  .topbar h1 { margin:0; font-size:18px; font-weight:600; }
  .topbar .sub { color:var(--muted); font-size:12px; }
  main { flex:1; min-width:0; padding:20px 24px 48px; overflow:auto; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  .card h2 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:15px; margin:0 0 12px; }
  .badge { padding:2px 8px; border-radius:999px; background:#eef2ff; color:#4338ca; font-size:11px; font-weight:600; }
  .badge.on { background:#dcfce7; color:var(--ok); }
  .badge.warn { background:#fef3c7; color:#92400e; }
  .badge.muted { background:#f3f4f6; color:#6b7280; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grow { flex:1; }
  button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:6px; padding:7px 13px; cursor:pointer; color:var(--txt); }
  button:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.primary:hover { background:#1d4ed8; color:#fff; }
  button.danger { color:#b91c1c; }
  button.danger:hover { border-color:#b91c1c; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input, select, textarea { font:inherit; border:1px solid var(--line); border-radius:6px; padding:7px 9px; background:#fff; color:var(--txt); }
  label { color:var(--muted); }
  .check { display:flex; align-items:center; gap:7px; margin:10px 0 0; color:var(--txt); }
  .note { margin:8px 0 4px; padding:9px 12px; background:#f8fafc; border-left:3px solid #c7d2fe; border-radius:0 6px 6px 0; color:#475569; font-size:12px; line-height:1.65; }
  .note b { color:#1f2937; }
  .hint { color:var(--muted); font-size:12px; margin:6px 0 12px; }
  .settings-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field span { font-size:12px; color:var(--muted); }
  .field input, .field select { width:100%; }

  /* 工具链配置：顶部应用提示 + 一行一个的基础配置 */
  .apply-banner { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 14px; margin-bottom:14px; background:#fffbeb; border:1px solid #fde68a; border-radius:9px; color:#78350f; font-size:12.5px; line-height:1.6; }
  .apply-banner b { color:#92400e; }
  .kv { display:grid; grid-template-columns:132px minmax(0,1fr); align-items:center; gap:5px 14px; padding:10px 0; border-bottom:1px dashed var(--line); }
  .kv:last-child { border-bottom:0; padding-bottom:0; }
  .kv > label { color:#374151; font-size:13px; }
  .kv .ctl { display:flex; gap:8px; align-items:center; min-width:0; }
  .kv .ctl input, .kv .ctl select { width:100%; }
  .kv .note { grid-column:2; margin:0; padding:0; background:none; border:0; font-size:12px; color:var(--muted); line-height:1.6; }
  .ver-table { margin-top:4px; min-width:640px; }
  .table-wrap { overflow-x:auto; }
  .ver-table th { font-size:12px; white-space:nowrap; }
  .ver-table td { padding:6px; vertical-align:top; }
  .ver-table td input[type=radio] { margin:0; }
  .ver-table td > input:not([type=radio]):not([type=checkbox]) { width:100%; }
  .ver-table .pvcell { min-width:200px; }
  .pu-row { display:flex; gap:6px; align-items:center; margin-bottom:5px; }
  .pu-row .pv { flex:1; min-width:0; width:auto; margin:0; }
  .pu-row button { flex:none; padding:3px 8px; }
  .ver-table .pvcell > button { padding:3px 9px; font-size:12px; }
  .kv .ctl .check { flex:none; white-space:nowrap; }

  .versions { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin:12px 0; }
  .ver { padding:10px 12px; text-align:left; background:#fafbfc; border-radius:8px; }
  .ver b { font-size:15px; }
  .ver small { display:block; margin-top:3px; font-size:11px; color:var(--muted); word-break:break-all; }
  .ver.active { border-color:var(--ok); background:#f0fdf4; }
  .ver.active b::after { content:" ✓"; color:var(--ok); }

  /* 工具链配置：左列表 + 右详情 */
  .tc-layout { display:flex; gap:16px; align-items:flex-start; }
  .tc-list { flex:0 0 216px; padding:8px; background:#fff; border:1px solid var(--line); border-radius:10px; position:sticky; top:0; }
  .tc-item { display:flex; flex-direction:column; gap:2px; padding:9px 11px; border-radius:7px; cursor:pointer; }
  .tc-item:hover { background:#f3f6fb; }
  .tc-item.active { background:#eef2ff; box-shadow:inset 3px 0 0 var(--accent); }
  .tc-item .nm { font-size:13px; font-weight:600; }
  .tc-item .ev { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--muted); }
  .tc-detail { flex:1; min-width:0; }

  /* 表格（环境变量 / 其它） */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; vertical-align:top; padding:7px 10px; border-bottom:1px solid var(--line); }
  thead th { background:#fbfcfd; font-size:12px; font-weight:600; color:var(--muted); }
  .env-group { margin-bottom:14px; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .env-head { display:flex; align-items:center; gap:8px; padding:10px 14px; background:#f8fafc; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
  .env-head b { font-size:14px; }
  .env-head .caret { font-size:12px; color:var(--muted); transition:transform .15s; display:inline-block; }
  .env-body { display:block; }
  .env-group.collapsed .env-head { border-bottom:0; }
  .env-group.collapsed .env-body { display:none; }
  .env-group.collapsed .caret { transform:rotate(-90deg); }
  .env-name { font-family:ui-monospace,Consolas,monospace; color:#374151; width:30%; word-break:break-all; }
  .env-val { word-break:break-all; white-space:pre-wrap; color:#111827; }
  .act-col { width:148px; text-align:right; white-space:nowrap; }
  .act-col button { margin-left:6px; padding:4px 10px; }
  .env-edit { width:100%; }
  .env-edit.multi { min-height:72px; font-family:ui-monospace,Consolas,monospace; font-size:12px; resize:vertical; }

  /* PATH 工具 */
  .path-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:820px) { .path-grid { grid-template-columns:1fr; } }
  .path-col { padding:12px 14px; background:#fafbfc; border:1px solid var(--line); border-radius:8px; }
  .path-col h3 { font-size:14px; margin:0 0 10px; }
  .path-col h4 { font-size:12px; margin:16px 0 6px; padding-bottom:5px; border-bottom:1px solid var(--line); color:var(--muted); }
  .path-col h4:first-of-type { margin-top:0; }
  .path-list { list-style:none; margin:0; padding:0; }
  .path-list li { display:flex; align-items:center; gap:8px; padding:5px 4px; border-bottom:1px dashed var(--line); font-size:12px; }
  .path-list li:last-child { border-bottom:0; }
  .path-list .content { flex:1; font-family:ui-monospace,Consolas,monospace; word-break:break-all; }
  .path-list input[type=checkbox] { flex:none; margin:0; }
  .path-list li.removed .content { text-decoration:line-through; color:#9ca3af; }
  .path-list li.invalid .content { color:#9ca3af; }

  #toast { position:fixed; right:20px; bottom:20px; z-index:10; display:none; max-width:420px; padding:11px 16px; border-radius:8px; background:#111827; color:#fff; box-shadow:0 6px 24px #0003; font-size:13px; white-space:pre-wrap; }
  #toast.ok { background:var(--ok); } #toast.err { background:#b91c1c; }
  code { padding:1px 5px; border-radius:4px; background:#eef1f5; font-size:12px; }

  @media (max-width:900px) {
    body { flex-direction:column; }
    .sidebar { flex:none; }
    .menu { flex-direction:row; flex-wrap:wrap; }
    .side-meta { border-top:0; margin-top:0; }
    .tc-layout { flex-direction:column; }
    .tc-list { flex:none; width:100%; position:static; }
  }
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand">EnvSwitch<small>多版本环境变量切换器</small></div>
  <nav class="menu" id="menu">
    <a href="/switch" data-page="switch">版本切换</a>
    <a href="/project" data-page="project">项目配置</a>
    <a href="/toolchain" data-page="toolchain">工具链配置</a>
    <a href="/path" data-page="path">PATH 工具</a>
    <a href="/env" data-page="env">环境变量</a>
  </nav>
  <div class="side-meta" id="meta">加载中…</div>
</aside>
<div class="shell">
  <div class="topbar">
    <h1 id="page-title">版本切换</h1>
    <span class="sub" id="page-sub"></span>
  </div>
  <main id="content"></main>
</div>
<div id="toast"></div>

<script>
const PAGES = {
  switch:    { title: '版本切换',   sub: '选中版本即可切换环境变量与 PATH' },
  project:   { title: '项目配置',   sub: 'PATH 作用范围、端口与启动行为' },
  toolchain: { title: '工具链配置', sub: '左侧选工具链，右侧编辑基础配置与版本' },
  path:      { title: 'PATH 工具',  sub: '查看、排序、去重并写入 PATH' },
  env:       { title: '环境变量',   sub: '用户与系统变量，可直接编辑值或删除' },
};

const $ = s => document.querySelector(s);
let state = { config: { toolchains: [], settings: {} }, configPath: '', current: {}, userPath: '', machinePath: '' };
let draft = null;                 // 项目配置 / 工具链配置的编辑副本
let dirty = false;                // 编辑副本是否有未保存修改
let curPage = 'switch';
let selectedTc = 0;               // 工具链配置页当前选中的工具链下标

function toast(msg, kind = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = kind;
  el.style.display = 'block';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.style.display = 'none', 5000);
}

async function api(url, options) {
  const res = await fetch(url, options);
  let data;
  try { data = await res.json(); } catch { data = { ok: false, message: res.statusText }; }
  if (!res.ok || (data && data.ok === false)) throw new Error(data?.message || res.statusText);
  return data;
}

const clone = o => JSON.parse(JSON.stringify(o));
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- 路由：/switch /project /toolchain /path /env ---------- */
function pageFromUrl() {
  const seg = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0].toLowerCase();
  if (PAGES[seg]) return seg;
  const q = (new URLSearchParams(location.search).get('page') || '').toLowerCase();
  if (PAGES[q]) return q;
  const h = location.hash.replace(/^#\/?/, '').toLowerCase();
  if (PAGES[h]) return h;
  return 'switch';
}

async function navigate(key, push = true) {
  if (!PAGES[key]) key = 'switch';
  if (dirty && (curPage === 'project' || curPage === 'toolchain')
      && !confirm('有未保存的修改，切换页面会丢弃，继续？')) {
    if (push) history.replaceState({ page: curPage }, '', '/' + curPage);
    return;
  }
  if (push && (location.pathname + location.search + location.hash).toLowerCase() !== ('/' + key)) {
    history.pushState({ page: key }, '', '/' + key);
  }
  await showPage(key);
}

async function showPage(key) {
  curPage = key;
  dirty = false;
  markMenu(key);
  $('#page-title').textContent = PAGES[key].title;
  $('#page-sub').textContent = PAGES[key].sub;
  // 每次切页都重新拉一次状态：别的页面改了配置，进来就能看到最新值
  try { await loadState(); }
  catch (e) { toast('读取状态失败：' + e.message, 'err'); }
  if (key === 'project' || key === 'toolchain') draft = clone(state.config);
  renderPage();
  if (key === 'path') loadPathView();
  if (key === 'env') loadEnvAll();
}

function markMenu(key) {
  document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('active', a.dataset.page === key));
}

async function loadState() {
  state = await api('/api/state');
  $('#meta').textContent = '配置：' + state.configPath;
}

function renderPage() {
  if (curPage === 'switch') return renderSwitch();
  if (curPage === 'project') return renderProject();
  if (curPage === 'toolchain') return renderToolchain();
  if (curPage === 'path') return renderPath();
  if (curPage === 'env') return renderEnv();
}

/* ---------- 版本切换 ---------- */
function renderSwitch() {
  const root = $('#content');
  const toolchains = state.config.toolchains.filter(t => t.enabled !== false);
  if (!toolchains.length) {
    root.innerHTML = '<div class="card">没有生效中的工具链。到「工具链配置」页新建或勾选「生效」。</div>';
    return;
  }
  root.innerHTML = toolchains.map((t) => {
    const i = state.config.toolchains.indexOf(t);
    const cur = state.current[t.name] || '(未设置)';
    const versions = t.versions.map(v => `
      <button class="ver ${v.name === t.active ? 'active' : ''}" data-apply="${i}" data-ver="${esc(v.name)}">
        <b>${esc(v.name)}</b><small>${esc(v.home)}${v.paths && v.paths.length ? ' · ' + v.paths.length + ' 条 PATH' : ''}</small>
      </button>`).join('');
    return `<div class="card">
      <h2>${esc(t.name)}
        ${t.envVar ? `<span class="badge">${esc(t.envVar)}</span>` : '<span class="badge muted">不写变量</span>'}
        <span class="badge">变量：${scopeLabel(t.envScope)}</span>
        <span class="badge">PATH：${scopeLabel(t.pathScope)}</span></h2>
      <div class="hint">当前 <code>${esc(t.envVar) || '(未配置)'}</code> = ${esc(cur)}</div>
      <div class="versions">${versions || '<div class="hint" style="margin:0">没有版本</div>'}</div>
      <div class="row"><label class="check" style="margin:0"><input type="checkbox" id="dry-${i}" checked> 仅预览，不写入</label></div>
    </div>`;
  }).join('');
  root.querySelectorAll('[data-apply]').forEach(btn => btn.addEventListener('click', () => {
    const i = +btn.dataset.apply;
    applyVersion(state.config.toolchains[i].name, btn.dataset.ver, $('#dry-' + i).checked);
  }));
}

async function applyVersion(toolchain, version, dryRun) {
  try {
    const r = await api('/api/apply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ toolchain, version, dryRun })
    });
    toast(r.message + (dryRun ? '\n（预览模式，未修改系统）' : ''), 'ok');
    await loadState();
    renderSwitch();
  } catch (e) { toast('切换失败：' + e.message, 'err'); }
}

/* ---------- 项目配置（全局设置） ---------- */
function renderProject() {
  if (!draft) draft = clone(state.config);
  const s = draft.settings || (draft.settings = {});
  const root = $('#content');
  root.innerHTML = `
  <div class="card">
    <h2>运行设置</h2>
    <div class="settings-grid">
      <label class="field"><span>服务端口（0 = 自动分配）</span>
        <input id="set-port" type="number" min="0" max="65535" value="${esc(s.port ?? 0)}"></label>
    </div>
    <label class="check"><input type="checkbox" id="set-normalize" ${s.normalizePathOnApply ? 'checked' : ''}> 切换版本时自动对 PATH 排序去重</label>
    <div class="note"><b>这一项是什么意思：</b>开启后每次切换版本都会把整条 PATH 重新排序并去掉重复条目（去重不区分大小写，并忽略结尾的 <code>\\</code>），避免反复切换后同一个目录越堆越多、顺序越来越乱。关闭则只按「原有条目 + 新版本条目」原样拼接。</div>
    <label class="check"><input type="checkbox" id="set-openbrowser" ${s.openBrowserOnStart ? 'checked' : ''}> 启动服务时自动打开浏览器</label>
    <div class="note">每套工具链可以单独决定写入当前用户还是整台系统（含「唯一」模式），到「工具链配置」页的对应项里设置。</div>
  </div>
  <div class="row">
    <button class="primary" id="save-project">保存项目配置</button>
    <button id="reset-project">放弃修改</button>
  </div>`;

  $('#set-port').addEventListener('input', e => { s.port = Number(e.target.value || 0); dirty = true; });
  $('#set-normalize').addEventListener('change', e => { s.normalizePathOnApply = e.target.checked; dirty = true; });
  $('#set-openbrowser').addEventListener('change', e => { s.openBrowserOnStart = e.target.checked; dirty = true; });
  $('#save-project').addEventListener('click', async () => {
    if (await persistDraft()) { toast('项目配置已保存', 'ok'); await showPage('project'); }
  });
  $('#reset-project').addEventListener('click', async () => { dirty = false; await showPage('project'); toast('已重新载入', 'ok'); });
}

async function persistDraft(silent = false) {
  const payload = clone(draft);
  payload.toolchains.forEach(t => (t.versions || []).forEach(v => {
    if (Array.isArray(v.paths)) v.paths = v.paths.filter(p => String(p).trim());
  }));
  try {
    await api('/api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    dirty = false;
    if (!silent) toast('配置已保存', 'ok');
    return true;
  } catch (e) { toast('保存失败：' + e.message, 'err'); return false; }
}

async function saveConfigDraft() {
  if (await persistDraft()) await showPage(curPage);
}

/* ---------- 工具链配置（左列表 + 右详情） ---------- */
const SCOPE_OPTIONS = [['User', '用户'], ['Machine', '系统'], ['UserOnly', '用户唯一'], ['MachineOnly', '系统唯一']];

function scopeLabel(value) {
  const hit = SCOPE_OPTIONS.find(x => x[0] === value);
  return hit ? hit[1] : '用户';
}

function scopeSelect(attr, value) {
  const cur = value || 'User';
  return `<select ${attr}>` + SCOPE_OPTIONS.map(([v, label]) =>
    `<option value="${v}" ${v === cur ? 'selected' : ''}>${label}</option>`).join('') + '</select>';
}

function kvRow(label, html, note) {
  return `<div class="kv"><label>${label}</label><div class="ctl">${html}</div><div class="note">ℹ️ ${note}</div></div>`;
}

function renderToolchain() {
  if (!draft) draft = clone(state.config);
  const tcs = draft.toolchains;
  const root = $('#content');
  if (selectedTc >= tcs.length) selectedTc = Math.max(0, tcs.length - 1);

  if (!tcs.length) {
    root.innerHTML = `<div class="card"><h2>还没有工具链</h2>
      <div class="hint" style="margin:0 0 12px">先新建一个，再在右侧填写环境变量名、PATH 模板和各版本。</div>
      <button class="primary" id="new-tc">+ 新建工具链</button></div>`;
    $('#new-tc').addEventListener('click', addToolchain);
    return;
  }

  const t = tcs[selectedTc];
  const cur = state.current[t.name] || '(未设置)';
  const list = tcs.map((x, i) => `<div class="tc-item ${i === selectedTc ? 'active' : ''}" data-tc="${i}">
      <span class="nm">${esc(x.name) || '(未命名)'}</span>
      <span class="ev">${x.enabled === false ? '不生效 · ' : ''}${esc(x.envVar) || '(不写变量)'}${x.active ? ' · ' + esc(x.active) : ''}</span>
    </div>`).join('');

  const rows = (t.versions || []).map((v, j) => {
    const paths = (v.paths && v.paths.length) ? v.paths : [''];
    const pathInputs = paths.map((p, pi) => `<div class="pu-row">
        <input class="pv" data-p="${j}.${pi}" value="${esc(p)}" placeholder="PATH 条目，如 %JAVA_HOME%\\bin">
        <button class="danger" data-act="del-path" data-j="${j}" data-pi="${pi}" title="删除此条">×</button>
      </div>`).join('');
    return `<tr>
      <td style="text-align:center"><button class="danger" data-act="del-ver" data-j="${j}" title="删除此版本">×</button></td>
      <td style="text-align:center"><input type="radio" name="active-ver" data-activate="${j}" ${v.name && v.name === t.active ? 'checked' : ''}></td>
      <td><input data-v="${j}.name" value="${esc(v.name)}" placeholder="如 17"></td>
      <td><input data-v="${j}.home" value="${esc(v.home)}" placeholder="Home 路径 / 变量值"></td>
      <td class="pvcell">${pathInputs}<button data-act="add-path" data-j="${j}">+ 添加 PATH 条目</button></td>
    </tr>`;
  }).join('');

  root.innerHTML = `
  <div class="apply-banner">
    <div><b>改完不会立即生效。</b>这里只修改配置；要让激活版本真正写进环境变量与 PATH，请点右侧「立即应用」（会先保存配置）。</div>
    <button class="primary" id="apply-active" style="flex:none">立即应用</button>
  </div>
  <div class="tc-layout">
    <aside class="tc-list">
      ${list}
      <div style="padding:6px 4px 2px"><button id="new-tc" style="width:100%">+ 新建工具链</button></div>
    </aside>
    <div class="tc-detail">
      <div class="card">
        <h2>基础配置 <span class="badge">${esc(t.name) || '未命名'}</span></h2>
        ${kvRow('工具链名称', `<input data-f="name" value="${esc(t.name)}" placeholder="如 Java">`,
                '显示用名称，用来区分多套工具链。')}
        ${kvRow('环境变量名', `<input data-f="envVar" value="${esc(t.envVar)}" placeholder="如 JAVA_HOME（可留空）">`,
                '切换版本时写入的变量名，值来自该版本的 Home。留空表示本工具链不写任何环境变量。')}
        ${kvRow('PATH 条目模板', `<input data-f="pathTemplate" value="${esc(t.pathTemplate)}" placeholder="如 %JAVA_HOME%\\bin（可留空）">`,
                '版本没有单独填写 PATH 条目时使用它，可用 %变量名% 引用该版本的环境变量值。模板留空且版本也没有条目时，不写 PATH。')}
        ${kvRow('本工具链是否生效', `<label class="check" style="margin:0"><input type="checkbox" data-f="enabled" ${t.enabled === false ? '' : 'checked'}> 生效</label>`,
                '取消勾选相当于没有配置过这套工具链：切换版本既不写变量也不动 PATH，版本切换页也会隐藏它。')}
        ${kvRow('环境变量作用范围', scopeSelect('data-f="envScope"', t.envScope),
                '用户：写用户变量；系统：写系统变量；用户唯一：写用户变量并删除系统侧同名变量；系统唯一：写系统变量并删除用户侧同名变量。写系统侧通常需要管理员权限。')}
        ${kvRow('PATH 作用范围', scopeSelect('data-f="pathScope"', t.pathScope),
                '用户 / 系统：改用户或系统 PATH；用户唯一：改用户 PATH 并把本工具链的条目从系统 PATH 移除；系统唯一：改系统 PATH 并把本工具链的条目从用户 PATH 移除。')}
        <div class="hint" style="margin:12px 0 0">当前 <code>${esc(t.envVar) || '(未配置)'}</code> = ${esc(cur)}</div>
      </div>
      <div class="card">
        <h2>版本列表</h2>
        <div class="table-wrap">
        <table class="ver-table">
          <thead><tr>
            <th style="width:52px">删除</th><th style="width:52px">激活</th><th style="width:110px">版本名</th>
            <th style="width:30%">Home（环境变量值）</th><th>PATH 条目</th>
          </tr></thead>
          <tbody>${rows || '<tr><td colspan="5" class="hint" style="margin:0">还没有版本，点下方按钮添加。</td></tr>'}</tbody>
        </table>
        </div>
        <button id="add-ver" style="margin-top:12px">+ 添加版本</button>
      </div>
      <div class="row">
        <button class="primary" id="save-tc">保存工具链配置</button>
        <button id="reset-tc">放弃修改</button>
        <span class="grow"></span>
        <button class="danger" id="del-tc">删除此工具链</button>
      </div>
    </div>
  </div>`;

  root.querySelectorAll('[data-tc]').forEach(el => el.addEventListener('click', () => {
    selectedTc = +el.dataset.tc;
    renderToolchain();
  }));
  $('#new-tc').addEventListener('click', addToolchain);
  $('#add-ver').addEventListener('click', () => {
    t.versions.push({ name: '', home: '', paths: [] });
    dirty = true;
    renderToolchain();
  });
  $('#save-tc').addEventListener('click', saveConfigDraft);
  $('#reset-tc').addEventListener('click', async () => { dirty = false; await showPage('toolchain'); toast('已重新载入', 'ok'); });
  $('#del-tc').addEventListener('click', () => {
    if (!confirm(`删除工具链「${t.name || '未命名'}」及其所有版本？保存后生效。`)) return;
    draft.toolchains.splice(selectedTc, 1);
    dirty = true;
    selectedTc = Math.max(0, selectedTc - 1);
    renderToolchain();
  });

  root.querySelectorAll('[data-f]').forEach(el => {
    const handler = e => {
      const el2 = e.target, k = el2.dataset.f;
      t[k] = el2.type === 'checkbox' ? el2.checked : el2.value;
      dirty = true;
      if (k === 'name') {
        const item = root.querySelector(`.tc-item[data-tc="${selectedTc}"] .nm`);
        if (item) item.textContent = el2.value || '(未命名)';
      }
      if (k === 'envVar' || k === 'enabled') updateItemSub(root, t);
    };
    el.addEventListener('input', handler);
    if (el.tagName === 'SELECT')
      el.addEventListener('change', handler);
  });
  root.querySelectorAll('[data-activate]').forEach(el => el.addEventListener('change', () => {
    t.active = t.versions[+el.dataset.activate]?.name || '';
    dirty = true;
    updateItemSub(root, t);
  }));
  root.querySelectorAll('[data-v]').forEach(el => el.addEventListener('input', e => {
    const [j, k] = e.target.dataset.v.split('.');
    const old = t.versions[+j][k];
    t.versions[+j][k] = e.target.value;
    // 改的是当前激活版本的版本名时，激活版本号跟着改
    if (k === 'name' && t.active === old) t.active = e.target.value;
    dirty = true;
  }));
  root.querySelectorAll('[data-p]').forEach(el => el.addEventListener('input', e => {
    const [j, pi] = e.target.dataset.p.split('.');
    if (!Array.isArray(t.versions[+j].paths)) t.versions[+j].paths = [];
    t.versions[+j].paths[+pi] = e.target.value;
    dirty = true;
  }));
  root.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => {
    const j = +el.dataset.j;
    if (!Array.isArray(t.versions[j].paths)) t.versions[j].paths = [];
    if (el.dataset.act === 'add-path') t.versions[j].paths.push('');
    if (el.dataset.act === 'del-path') t.versions[j].paths.splice(+el.dataset.pi, 1);
    if (el.dataset.act === 'del-ver') {
      if (t.active === t.versions[j].name) t.active = '';
      t.versions.splice(j, 1);
    }
    dirty = true;
    renderToolchain();
  }));

  $('#apply-active').addEventListener('click', () => applyActiveToolchain(t));
}

function updateItemSub(root, t) {
  const item = root.querySelector(`.tc-item[data-tc="${selectedTc}"] .ev`);
  if (!item) return;
  item.textContent = (t.enabled === false ? '不生效 · ' : '')
    + (t.envVar || '(不写变量)') + (t.active ? ' · ' + t.active : '');
}

async function applyActiveToolchain(t) {
  if (t.enabled === false) { toast('该工具链当前为「不生效」，先勾选生效再应用。', 'err'); return; }
  if (!t.name) { toast('工具链名称不能为空。', 'err'); return; }
  if (!t.active) { toast('先在版本表格的「激活」列点选一个版本。', 'err'); return; }

  const activeVersion = (t.versions || []).find(v => v.name === t.active);
  const hasPaths = !!activeVersion && (activeVersion.paths || []).some(p => String(p).trim()) || !!String(t.pathTemplate || '').trim();
  const envLine = t.envVar ? `${t.envVar} = 该版本 Home（${scopeLabel(t.envScope)}）` : '不写环境变量';
  const pathLine = hasPaths ? `PATH（${scopeLabel(t.pathScope)}）` : '不写 PATH';
  if (!confirm(`立即应用「${t.name} → ${t.active}」？\n环境变量：${envLine}\nPATH：${pathLine}\n写系统侧需要管理员权限。`)) return;

  if (!await persistDraft(true)) return;
  try {
    const r = await api('/api/apply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ toolchain: t.name, version: t.active, dryRun: false })
    });
    toast(r.message, 'ok');
    await showPage('toolchain');
  } catch (e) { toast('应用失败：' + e.message, 'err'); }
}

function addToolchain() {
  draft.toolchains.push({
    name: '', envVar: '', pathTemplate: '', addToPath: true,
    enabled: true, envScope: 'User', pathScope: 'User', active: '', versions: [],
  });
  selectedTc = draft.toolchains.length - 1;
  dirty = true;
  renderToolchain();
}

/* ---------- PATH 工具 ---------- */
let pathView = null;

function renderPath() {
  $('#content').innerHTML = `
    <div class="card">
      <div class="row">
        <label class="check" style="margin:0"><input type="checkbox" id="path-sort" checked> 排序</label>
        <label class="check" style="margin:0"><input type="checkbox" id="path-dedup" checked> 去重</label>
        <button id="path-refresh">刷新列表</button>
        <span class="grow"></span>
        <label class="check" style="margin:0"><input type="checkbox" id="path-dry" checked> 仅预览，不写入</label>
        <button id="path-apply" class="primary">应用写入</button>
      </div>
      <div id="path-msg" class="hint"></div>
      <div id="path-grid" class="path-grid"></div>
      <p class="hint">规则：系统与用户中完全相同的条目会从用户的「处理后」列表自动移除；同一工具链的不同版本会用徽标标注；<b>目录已不存在的条目会在「处理后」列表自动剔除，只在「当前」列表以「已失效」标出</b>；「处理后」列表可勾选要保留的条目。</p>
    </div>`;
  ['path-sort', 'path-dedup'].forEach(id => $('#' + id).addEventListener('change', loadPathView));
  $('#path-refresh').addEventListener('click', loadPathView);
  $('#path-apply').addEventListener('click', applyPath);
}

async function loadPathView() {
  try {
    pathView = await api('/api/path/view', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sort: $('#path-sort').checked, dedup: $('#path-dedup').checked })
    });
    drawPathView();
  } catch (e) { toast('读取失败：' + e.message, 'err'); }
}

function pathList(items, name) {
  const editable = !!name;
  return `<ul class="path-list">${items.map(it => {
    const invalid = it.exists === false;
    const badge = it.badge
      ? `<span class="badge ${invalid ? 'warn' : it.removed ? 'muted' : (it.badge.includes('冲突') ? 'warn' : '')}">${esc(it.badge)}</span>`
      : '';
    const box = editable
      ? `<input type="checkbox" data-list="${name}" data-value="${esc(it.value)}" ${it.removed ? 'disabled' : 'checked'}>`
      : '';
    return `<li class="${it.removed ? 'removed' : ''} ${invalid ? 'invalid' : ''}"><span class="content">${esc(it.value)}</span>${badge}${box}</li>`;
  }).join('')}</ul>`;
}

function drawPathView() {
  const grid = $('#path-grid');
  if (!grid || !pathView) return;
  $('#path-msg').textContent = pathView.message;
  grid.innerHTML = `
    <div class="path-col">
      <h3>当前</h3>
      <h4>系统</h4>${pathList(pathView.systemCurrent, '')}
      <h4>用户</h4>${pathList(pathView.userCurrent, '')}
    </div>
    <div class="path-col">
      <h3>处理后</h3>
      <h4>系统</h4>${pathList(pathView.systemProcessed, 'system')}
      <h4>用户</h4>${pathList(pathView.userProcessed, 'user')}
    </div>`;
}

async function applyPath() {
  const collect = name => Array.from(document.querySelectorAll(`input[data-list="${name}"]:checked`))
    .map(el => el.dataset.value);
  const body = { system: collect('system'), user: collect('user'), dryRun: $('#path-dry').checked };
  try {
    const r = await api('/api/path/apply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    toast(r.message, 'ok');
    if (!body.dryRun) { await loadState(); await loadPathView(); }
  } catch (e) { toast('应用失败：' + e.message, 'err'); }
}

/* ---------- 环境变量：用户 + 系统双分组，可折叠，可编辑 / 删除 ---------- */
let envData = { User: {}, Machine: {} };
let envOpen = { User: true, Machine: true };
let envEdit = null;           // { scope, name }
let envFilterText = '';

function renderEnv() {
  $('#content').innerHTML = `
    <div class="card">
      <div class="row">
        <input id="env-filter" class="grow" placeholder="筛选变量名或值…">
        <button id="env-refresh">重新读取</button>
        <span class="hint" id="env-count" style="margin:0"></span>
      </div>
      <p class="hint">保存或删除后会立即作用于当前进程与新启动的程序（已运行的窗口需重启才能读到新值）。系统变量一般需要以管理员身份运行才能写入或删除。变量值是一个目录或文件路径、但目标已不存在时，变量名后会标出「已失效」。</p>
      <div id="env-groups"></div>
    </div>`;
  $('#env-filter').value = envFilterText;
  $('#env-filter').addEventListener('input', e => { envFilterText = e.target.value; drawEnvGroups(); });
  $('#env-refresh').addEventListener('click', loadEnvAll);
  drawEnvGroups();
}

async function loadEnvAll() {
  try {
    const [u, m] = await Promise.all([api('/api/env?scope=User'), api('/api/env?scope=Machine')]);
    envData = { User: u, Machine: m };
    drawEnvGroups();
  } catch (e) { toast('读取环境变量失败：' + e.message, 'err'); }
}

function envRow(scope, k, o) {
  const v = String((o && o.value) ?? '');
  const invalid = !!(o && o.invalid);
  const nameCell = `${esc(k)}${invalid ? '<span class="badge warn" style="margin-left:6px">已失效</span>' : ''}`;
  const editing = envEdit && envEdit.scope === scope && envEdit.name === k;
  if (editing) {
    const multiline = v.length > 60 || v.includes(';');
    const field = multiline
      ? `<textarea class="env-edit multi" id="env-edit-input" rows="3">${esc(v)}</textarea>`
      : `<input class="env-edit" id="env-edit-input" value="${esc(v)}">`;
    return `<tr><td class="env-name">${nameCell}</td><td class="env-val">${field}</td>
      <td class="act-col"><button class="primary" data-save="${esc(k)}" data-scope="${scope}">保存</button><button data-cancel="1">取消</button></td></tr>`;
  }
  return `<tr><td class="env-name">${nameCell}</td>
    <td class="env-val">${v ? esc(v) : '<span class="hint" style="margin:0">（空）</span>'}</td>
    <td class="act-col"><button data-edit="${esc(k)}" data-scope="${scope}">编辑</button><button class="danger" data-del="${esc(k)}" data-scope="${scope}">删除</button></td></tr>`;
}

function drawEnvGroups() {
  const g = $('#env-groups');
  if (!g) return;
  const f = envFilterText.trim().toLowerCase();
  let total = 0;
  g.innerHTML = ['User', 'Machine'].map(scope => {
    const title = scope === 'User' ? '👤 用户变量' : '🖥 系统变量';
    const items = Object.entries(envData[scope] || {})
      .filter(([k, o]) => !f || k.toLowerCase().includes(f) || String((o && o.value) ?? '').toLowerCase().includes(f))
      .sort((a, b) => a[0].localeCompare(b[0], 'zh-CN'));
    total += items.length;
    const open = envOpen[scope];
    return `<section class="env-group ${open ? '' : 'collapsed'}">
      <div class="env-head" data-toggle="${scope}">
        <span class="caret">▾</span><b>${title}</b><span class="badge">${items.length}</span>
        <span class="hint" style="margin:0">${open ? '点击标题收起' : '点击标题展开'}</span>
      </div>
      <div class="env-body">
        <table><thead><tr><th>变量</th><th>值</th><th class="act-col">操作</th></tr></thead>
        <tbody>${items.map(([k, o]) => envRow(scope, k, o)).join('') ||
          `<tr><td colspan="3" class="hint" style="margin:0">${f ? '没有匹配的变量' : '读取不到变量'}</td></tr>`}</tbody></table>
      </div>
    </section>`;
  }).join('');
  $('#env-count').textContent = f ? `匹配 ${total} 个变量` : `共 ${total} 个变量`;

  g.querySelectorAll('[data-toggle]').forEach(h => h.addEventListener('click', () => {
    const s = h.dataset.toggle;
    envOpen[s] = !envOpen[s];
    drawEnvGroups();
  }));
  g.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
    envEdit = { scope: b.dataset.scope, name: b.dataset.edit };
    drawEnvGroups();
    const input = $('#env-edit-input');
    if (input) { input.focus(); input.select && input.select(); }
  }));
  g.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => {
    envEdit = null;
    drawEnvGroups();
  }));
  g.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', () => {
    const input = $('#env-edit-input');
    saveEnv(b.dataset.scope, b.dataset.save, input ? input.value : '');
  }));
  g.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => delEnv(b.dataset.scope, b.dataset.del)));
}

async function saveEnv(scope, name, value) {
  try {
    const r = await api('/api/env/set', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scope, name, value })
    });
    toast(r.message, 'ok');
    envEdit = null;
    await loadEnvAll();
    await loadState();
  } catch (e) { toast('写入失败：' + e.message, 'err'); }
}

async function delEnv(scope, name) {
  const label = scope === 'Machine' ? '系统' : '用户';
  if (!confirm(`确定删除${label}变量「${name}」？\n删除后不可恢复${scope === 'Machine' ? '，系统变量还可能影响其它程序' : ''}。`)) return;
  try {
    const r = await api('/api/env/delete', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scope, name })
    });
    toast(r.message, 'ok');
    envEdit = null;
    await loadEnvAll();
    await loadState();
  } catch (e) { toast('删除失败：' + e.message, 'err'); }
}

/* ---------- 启动 ---------- */
document.querySelectorAll('#menu a').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  navigate(a.dataset.page, true);
}));
window.addEventListener('popstate', () => showPage(pageFromUrl()));
// 浏览器把 /switch 直接刷新时，服务端返回同一页面，这里按地址渲染对应菜单
showPage(pageFromUrl()).catch(e => toast('加载失败：' + e.message, 'err'));
</script>
</body>
</html>
